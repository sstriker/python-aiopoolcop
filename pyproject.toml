[tool.poetry]
name = "aiopoolcop"
version = "1.0.0"
description = "Asynchronous Python client for the PoolCop Client API"
authors = ["Sander Striker <s.striker@striker.nl>"]
maintainers = ["Sander Striker <s.striker@striker.nl>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/sstriker/python-aiopoolcop"
repository = "https://github.com/sstriker/python-aiopoolcop"
documentation = "https://github.com/sstriker/python-aiopoolcop"
keywords = ["poolcop", "pool", "api", "async", "client", "home-assistant"]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "aiopoolcop" }
]

[tool.poetry.dependencies]
aiohttp = ">=3.0.0"
python = "^3.14"
yarl = ">=1.6.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/sstriker/python-aiopoolcop/issues"
Changelog = "https://github.com/sstriker/python-aiopoolcop/releases"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
pytest-cov = ">=4.0"
aioresponses = ">=0.7"
# aioresponses <=0.7.9 breaks on aiohttp 3.14 (ClientResponse now requires
# stream_writer); drop once https://github.com/pnuckowski/aioresponses/pull/290
# or an equivalent fix is released. Only affects the test environment.
aiohttp = "<3.14"
ruff = ">=0.6"
pre-commit = ">=3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "S",   # flake8-bandit
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",  # assert in tests is expected
  "S105",  # hardcoded passwords in tests are fine
  "S106",  # hardcoded password arguments in tests are fine
]

[tool.mypy]
python_version = "3.14"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
addopts = "-q --cov=aiopoolcop --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
